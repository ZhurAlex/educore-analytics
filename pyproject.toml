[project]
name = "educore-analytics"
version = "0.1.0"
description = "Analyzes student answers from EduCore to detect learning gaps and generate teacher recommendations"
authors = [
    {name = "ZhurAlex",email = "265831799+ZhurAlex@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-genai (>=2.18.1,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mistralai (>=2.9.3,<3.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "markdown (>=3.10.3,<4.0.0)",
    "bleach (>=6.4.0,<7.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "-vv"
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
omit = ["tests/*"]
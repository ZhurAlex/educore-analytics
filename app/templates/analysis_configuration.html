{% extends "base.html" %}

{% block title %}Analysis Setup — EduCore Analytics{% endblock %}

{% block content %}
  <h1>Which analysis would you like to do?</h1>
    <form method="get">
        <select id="subject" name="subject" required="true">
            <option value="" disabled selected>Chose subject</option>
            <option value="english">English</option>
            <option value="math">Math</option>
        </select>
        <select id="language" name="language" required="true">
            <option value="" disabled selected>Chose language</option>
            <option value="english">English</option>
            <option value="ukrainian">Ukrainian</option>
            <option value="russian">Russian</option>
        </select>
        <button type="submit" formaction="/class/{{ class_id }}/tests">Class analysis</button>
        <button type="submit" formaction="/class/{{ class_id }}/students">Student analysis</button>
    </form>
{% endblock %}
